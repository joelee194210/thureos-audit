name: thureos-compliance

services:
  mongo:
    image: mongo:7
    container_name: thureos-compliance-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: thureos_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: thureos_compliance
    volumes:
      - thureos_compliance_mongo_data:/data/db
    networks:
      - thureos-compliance-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: thureos-compliance-redis
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - thureos_compliance_redis_data:/data
    networks:
      - thureos-compliance-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thureos-compliance-backend
    environment:
      PORT: "8080"
      APP_ENV: production
      MONGO_URI: mongodb://thureos_admin:${MONGO_PASS}@mongo:27017/thureos_compliance?authSource=admin
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ""
      ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - mongo
      - redis
    networks:
      - thureos-compliance-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    container_name: thureos-compliance-frontend
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
    networks:
      - thureos-compliance-net
    restart: unless-stopped

networks:
  thureos-compliance-net:
    driver: bridge

volumes:
  thureos_compliance_mongo_data:
  thureos_compliance_redis_data:
